name: Release Build and Push

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type to increment: major, minor, or patch'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true  # This ensures the GITHUB_TOKEN is available
          fetch-depth: 0   # Fetch all tags for version bumping

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Determine New Version
        id: bump_version
        shell: bash
        run: |
          # Get the latest tag or default to 0.0.0 if none found
          latest=$(git describe --tags --abbrev=0 || echo "0.0.0")
          echo "Latest version: $latest"
          IFS='.' read -r major minor patch <<< "$latest"
          major=${major:-0}
          minor=${minor:-0}
          patch=${patch:-0}

          release_type="${{ github.event.inputs.release_type }}"
          if [ "$release_type" = "major" ]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [ "$release_type" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new_version="${major}.${minor}.${patch}"
          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.bump_version.outputs.new_version }}"
          git tag "$tag"
          git push origin "$tag"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        shell: bash
        run: |
          new_version="${{ steps.bump_version.outputs.new_version }}"
          # Tag for Docker Hub
          docker_hub_image="${{ secrets.DOCKERHUB_USERNAME }}/status-monitor-node:${new_version}"
          # Tag for GitHub Container Registry (ghcr.io)
          ghcr_image="ghcr.io/${{ github.repository_owner }}/status-monitor-node:${new_version}"

          docker build -t "$docker_hub_image" -t "$ghcr_image" .
          docker push "$docker_hub_image"
          docker push "$ghcr_image"

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          new_version="${{ steps.bump_version.outputs.new_version }}"
          # Try to find the previous tag (skip the new one)
          previous=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1) || echo "")
          if [ -z "$previous" ]; then
            echo "No previous tag found. Listing all commits."
            changelog=$(git log --pretty=format:"* %s")
          else
            echo "Previous tag: $previous"
            changelog=$(git log "$previous".."$new_version" --pretty=format:"* %s")
          fi
          echo "Changelog generated:"
          echo "$changelog"
          # Set changelog as an output variable
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.bump_version.outputs.new_version }}
          release_name: "Release ${{ steps.bump_version.outputs.new_version }}"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
